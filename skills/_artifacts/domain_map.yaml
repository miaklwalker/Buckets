library:
  name: '@michaelrwalker/buckets'
  version: '0.5.0'
  repository: '' # no "repository" field in package.json; homepage is https://michaelrwalker.netlify.app/buckets
  description: 'A rule engine for sorting items into named buckets or running named actions, using boolean rules over named, possibly-async conditions.'
  primary_framework: 'framework-agnostic'

domains:
  - name: 'Modeling decisions'
    slug: 'modeling-decisions'
    description: >
      Turning ad hoc boolean logic (nested if/ternary/switch chains over
      several inputs) into named conditions, gated preconditions, and named
      combinations. This is the conceptual core everything else builds on.

  - name: 'Sorting and dispatch'
    slug: 'sorting-and-dispatch'
    description: >
      Declaring buckets as boolean expressions over conditions, processing a
      batch or a single item, and reading the resulting report — including
      what's guaranteed (nothing disappears) and what isn't (buckets are not
      a partition).

  - name: 'Running effects'
    slug: 'running-effects'
    description: >
      ActionEngine's shape of the same problem: instead of grouping items
      under names, running named side effects on the items that qualify,
      independently of one another.

  - name: 'Operating at scale'
    slug: 'operating-at-scale'
    description: >
      What changes once conditions do real work and batches get large:
      async checkFns, concurrency tuning, auditing conditions before a rule
      exists, and watching a long batch progress live.

skills:
  - name: 'Model decision logic with conditions'
    slug: 'model-decision-logic'
    domain: 'modeling-decisions'
    description: >
      Replace a nested if/ternary/switch decision (e.g. a shipping-policy
      table keyed on weight, price, and time of day) with named conditions,
      preconditions, computed conditions, and the four boolean combinators.
    type: 'core'
    covers:
      - 'defineInput'
      - 'defineCondition'
      - 'when (preconditions)'
      - 'defineComputedCondition'
      - 'AND / OR / NOT / ONLY'
      - 'definedIn / presentIn / pathIn (property-existence predicates)'
    tasks:
      - 'Turn a multi-input decision table (weight/price/time-based shipping policy) into named conditions and rules instead of nested if/ternary/switch'
      - 'Gate an expensive or dependent condition behind a cheaper precondition with when'
      - 'Name a reusable combination of conditions once with defineComputedCondition instead of repeating it at every call site'
      - 'Pick the right combinator for "not both" vs "neither" vs "exactly one"'
      - 'Model conditions over a nested, optional object (product.name, product.description) by gating on an existence condition instead of optional-chaining every nested check'
      - 'Write an existence or nested-property predicate with definedIn/presentIn/pathIn instead of hand-writing the type guard'
    failure_modes:
      - mistake: 'Confusing NAND with NOR'
        mechanism: >
          NOT(AND(A, B)) means "not both" and matches three of four truth-table
          rows, not just the all-false row people expect from reading it as
          English. The engine never rewrites the tree — it evaluates AND first,
          then flips the result.
        wrong_pattern: |
          // Intending "neither condition holds"
          checkFn: ({ AND, NOT }) => NOT(AND("condOne", "condTwo"))
        correct_pattern: |
          // "Neither" is NOR, not "not both"
          checkFn: ({ OR, NOT }) => NOT(OR("condOne", "condTwo"))
        source: 'docs/guides/boolean-logic.md'
        priority: 'HIGH'
        status: 'active'
        skills: ['model-decision-logic']

      - mistake: 'Writing manual if/ternary/switch chains instead of reaching for the engine at all'
        mechanism: >
          The library's whole reason to exist is decision tables like
          "price > 500 && weight in [50,1000) => policy 1"; an agent that
          doesn't recognize this shape defaults to hand-written conditionals
          that re-evaluate the same predicate in every branch and can quietly
          disagree with each other about what a term like "digital" means.
        wrong_pattern: |
          function policyFor(order: Order): string {
            if (order.price > 500 && order.weightKg > 50 && order.weightKg < 1000) return "policy1";
            if (order.weightKg >= 1000) return "policy5";
            // ...more branches, each re-deriving the same facts
          }
        correct_pattern: |
          const shipping = new BucketEngine()
            .defineInput<Order>()
            .defineCondition({ name: "isHighValue", checkFn: (o) => o.price > 500 })
            .defineCondition({ name: "isMidWeight", checkFn: (o) => o.weightKg > 50 && o.weightKg < 1000 })
            .defineCondition({ name: "isHeavy", checkFn: (o) => o.weightKg >= 1000 })
            .defineBucket({ name: "policy1", checkFn: ({ AND }) => AND("isHighValue", "isMidWeight") })
            .defineBucket({ name: "policy5", checkFn: () => "isHeavy" });
        source: 'maintainer interview'
        priority: 'CRITICAL'
        status: 'active'
        skills: ['model-decision-logic']

      - mistake: 'Adding a condition after the first bucket or computed condition'
        mechanism: >
          Every condition must be declared before the first computed
          condition and the first bucket, because ONLY's meaning ("this and
          nothing else") depends on the complete set of conditions. Adding
          one later would silently change what an existing ONLY rule
          matches, so the engine throws instead.
        wrong_pattern: |
          const engine = new BucketEngine()
            .defineInput<Item>()
            .defineCondition({ name: "a", checkFn: (i) => i.a })
            .defineBucket({ name: "onlyA", checkFn: ({ ONLY }) => ONLY("a") })
            .defineCondition({ name: "b", checkFn: (i) => i.b }); // throws BucketError
        correct_pattern: |
          const engine = new BucketEngine()
            .defineInput<Item>()
            .defineCondition({ name: "a", checkFn: (i) => i.a })
            .defineCondition({ name: "b", checkFn: (i) => i.b })
            .defineBucket({ name: "onlyA", checkFn: ({ ONLY }) => ONLY("a") });
        source: 'modules/engine.ts (defineCondition/defineComputedCondition ordering throws); docs/guides/conditions.md'
        priority: 'HIGH'
        status: 'active'
        skills: ['model-decision-logic']

      - mistake: "Passing a computed condition's name to ONLY"
        mechanism: >
          ONLY counts only plain conditions — a computed condition restates
          facts already counted, so counting it too would make ONLY
          contradict itself (e.g. a computed "nothingFilledIn" would make a
          bare ONLY() unsatisfiable). Rejected at compile time and again at
          runtime.
        wrong_pattern: |
          .defineComputedCondition({ name: "listedCorrectly", checkFn: ({ AND }) => AND("hasPrice", "hasWeight") })
          .defineBucket({ name: "bad", checkFn: ({ ONLY }) => ONLY("listedCorrectly") }) // compile + runtime error
        correct_pattern: |
          .defineBucket({ name: "ok", checkFn: ({ AND, NOT }) => AND("hasPrice", NOT("hasWeight")) })
        source: 'docs/guides/computed-conditions.md; docs/reference/combinators.md'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['model-decision-logic']

      - mistake: 'Inverting an AND-of-facts with NOT(AND(...)) expecting it to mean "everything is valid"'
        mechanism: >
          NOT(AND(a, b)) is NAND: true whenever *at least one* operand is
          false, not only when all of them are. Naming that expression
          "isValid" produces the opposite of validity — it reads true
          precisely when something is wrong. A plain AND(...) already
          states "all of these hold" directly and is not itself a mistake;
          the trap is reaching for NOT(AND(...)) as a shortcut to express
          validity instead. If you'd rather name the failure condition
          explicitly, the correct negative form is
          NOT(OR(NOT(a), NOT(b), ...)) — De Morgan's, not NOT(AND(...)) —
          which composes AND(a, b, ...) back out and is a matter of
          preference (naming the failure mode reads better as the check
          list grows), not a correctness fix.
        wrong_pattern: |
          .defineComputedCondition({
            name: "isValid",
            checkFn: ({ AND, NOT }) => NOT(AND("hasValidPassword", "passwordsMatch")),
            // NAND, not validity — true whenever something is WRONG
          })
        correct_pattern: |
          // Directly: AND already says "all hold" — nothing to invert
          .defineComputedCondition({
            name: "isValid",
            checkFn: ({ AND }) => AND("hasValidEmail", "hasValidPassword", "passwordsMatch"),
          })

          // Or, to name the failure mode explicitly — via De Morgan's, not NOT(AND(...)):
          .defineComputedCondition({
            name: "hasInvalidField",
            checkFn: ({ OR, NOT }) => OR(NOT("hasValidEmail"), NOT("hasValidPassword"), NOT("passwordsMatch")),
          })
          .defineComputedCondition({
            name: "isValid",
            checkFn: ({ NOT }) => NOT("hasInvalidField"),
          })
        source: 'maintainer interview; docs/guides/boolean-logic.md (NAND ≠ NOR)'
        priority: 'CRITICAL'
        status: 'active'
        skills: ['model-decision-logic']

      - mistake: 'Optional-chaining defensively inside a nested-property checkFn instead of gating on an existence condition'
        mechanism: >
          When a condition reads a property nested inside an optional
          object (e.g. product.name where product itself may be absent),
          the instinct is to defend with optional chaining at every
          checkFn that touches it. Defining an existence condition for the
          parent (hasProduct) and gating the nested conditions behind it
          with when makes the engine guarantee the parent is present before
          checkFn ever runs, narrowing the type and removing the need for
          optional chaining or repeated null checks across every condition
          that touches that object.
        wrong_pattern: |
          interface Listing { readonly product?: { name: string; description: string } }

          .defineCondition({ name: "hasName", checkFn: (l: Listing) => (l.product?.name?.length ?? 0) > 0 })
          .defineCondition({ name: "hasDescription", checkFn: (l: Listing) => (l.product?.description?.length ?? 0) > 0 })
          // every condition on a product field re-derives "is product even there?"
        correct_pattern: |
          import { definedIn } from "@michaelrwalker/buckets";

          .defineCondition({
            name: "hasProduct",
            checkFn: definedIn<Listing>()("product"),
          })
          .defineCondition({
            name: "hasName",
            when: () => "hasProduct",
            checkFn: (l) => l.product.name.length > 0, // no `?.` — hasProduct already proved product exists
          })
          .defineCondition({
            name: "hasDescription",
            when: () => "hasProduct",
            checkFn: (l) => l.product.description.length > 0,
          })
        source: 'maintainer interview; docs/guides/preconditions.md (the hasProduct/hasWeight example)'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['model-decision-logic']

      - mistake: 'Hand-writing an existence type guard instead of using definedIn/presentIn/pathIn'
        mechanism: >
          A condition that only checks "is this property there" — the
          hasProduct shape — is exactly what definedIn (or presentIn, for
          properties where null shouldn't count as present) already writes
          for you: pin the object type once with an argument-free first
          call, then the key, and the result is a properly narrowing
          checkFn. A hand-written `item.product !== undefined` works for
          the common case but reinvents a helper the library ships
          specifically for this, and skips the real
          Object.getOwnPropertyDescriptor check (and __proto__/constructor
          guard) that definedIn/presentIn use instead of a bare `!==`
          comparison. For a property one or more hops deep (product.weightKg),
          pathIn does the same thing per hop, narrowing the whole path at once.
        wrong_pattern: |
          .defineCondition({
            name: "hasProduct",
            checkFn: (item): item is Listing & { product: Product } =>
              item.product !== undefined,
          })
        correct_pattern: |
          import { definedIn } from "@michaelrwalker/buckets";

          .defineCondition({
            name: "hasProduct",
            checkFn: definedIn<Listing>()("product"),
          })
        source: 'docs/reference/predicates.md'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['model-decision-logic']

  - name: 'Sort items into buckets'
    slug: 'sort-items-into-buckets'
    domain: 'sorting-and-dispatch'
    description: >
      Declare buckets over already-modeled conditions, run process()/
      processOne() over data, and read buckets/unmatched/errors correctly —
      including using missingCombinations() and type-predicate conditions to
      get narrowed bucket types.
    type: 'core'
    covers:
      - 'defineBucket'
      - 'process / processOne'
      - 'BucketReport (buckets / unmatched / errors)'
      - 'missingCombinations()'
      - 'type narrowing via type-predicate conditions'
    tasks:
      - 'Sort a batch of items (e.g. a product catalog) into named work queues or fulfillment lanes'
      - 'Read report.unmatched to find the rule you have not written yet'
      - 'Call missingCombinations() before shipping to find uncovered combinations without needing data to surface them'
      - 'Write a condition as a type predicate so a bucket hands back a narrowed type instead of the input type'
    failure_modes:
      - mistake: 'Treating buckets as a partition of the batch'
        mechanism: >
          Buckets are independent yes/no questions, not mutually exclusive
          categories. An item satisfying two rules lands in both buckets, so
          summing bucket lengths can exceed the batch size — that is the
          design, not a bug.
        wrong_pattern: |
          // Assuming an item can only be in one bucket
          const total = Object.values(report.buckets).reduce((n, b) => n + b.length, 0);
          assert(total === items.length); // wrong assumption — will fail whenever rules overlap
        correct_pattern: |
          // What's actually guaranteed: every item is in >=1 bucket, unmatched, or errors
          const accounted = new Set([
            ...Object.values(report.buckets).flat().map(itemKey),
            ...report.unmatched.map((u) => itemKey(u.item)),
            ...report.errors.map((e) => itemKey(e.item)),
          ]);
          assert(accounted.size === items.length);
        source: 'docs/overview.md; docs/guides/buckets.md; docs/reference/process-output.md'
        priority: 'CRITICAL'
        status: 'active'
        skills: ['sort-items-into-buckets']

      - mistake: 'Branching a shared engine variable instead of using clone()'
        mechanism: >
          define* methods mutate the engine and return the same object, so
          calling defineBucket twice off one shared variable does not create
          two independent engines — both variables end up pointing at one
          engine holding every bucket ever defined on it, while the types
          only claim what each call added.
        wrong_pattern: |
          const base = engineWithConditions;
          const one = base.defineBucket({ name: "a", checkFn: () => "hasWeight" });
          const two = base.defineBucket({ name: "b", checkFn: () => "isDigital" });
          // one === two === base; both hold *both* buckets at runtime
        correct_pattern: |
          const one = base.clone().defineBucket({ name: "a", checkFn: () => "hasWeight" });
          const two = base.clone().defineBucket({ name: "b", checkFn: () => "isDigital" });
        source: 'docs/guides/cloning.md'
        priority: 'HIGH'
        status: 'active'
        skills: ['sort-items-into-buckets']

      - mistake: 'Expecting a bucket built on NOT(...) or a plain-boolean condition to narrow its item type'
        mechanism: >
          NOT proves nothing about what an item is, only what it isn't, and a
          condition without a type predicate contributes nothing to narrow.
          A bucket built from either keeps the engine's TInput rather than a
          narrowed type — this is correct, not a bug to work around.
        wrong_pattern: |
          .defineCondition({ name: "isString", checkFn: (v): v is string => typeof v === "string" })
          .defineBucket({ name: "notStrings", checkFn: ({ NOT }) => NOT("isString") })
          // report.buckets.notStrings.map(v => v.length) — compile error, type is still `unknown`/TInput
        correct_pattern: |
          // If you need the narrowed type, write the positive predicate for what it IS
          .defineCondition({ name: "isNumber", checkFn: (v): v is number => typeof v === "number" })
          .defineBucket({ name: "numbers", checkFn: () => "isNumber" })
        source: 'docs/guides/narrowing.md; docs/reference/combinators.md'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['sort-items-into-buckets']

      - mistake: 'Calling process() or processOne() before any bucket is defined'
        mechanism: >
          Both require at least one bucket and an input to have been
          defined; calling either before that throws a BucketError
          immediately rather than running with zero rules. (processConditions
          is the exception — it needs only an input.)
        wrong_pattern: |
          const engine = new BucketEngine().defineInput<Item>().defineCondition({ name: "a", checkFn: (i) => i.a });
          await engine.process(items); // throws — no bucket defined yet
        correct_pattern: |
          const engine = new BucketEngine()
            .defineInput<Item>()
            .defineCondition({ name: "a", checkFn: (i) => i.a })
            .defineBucket({ name: "hasA", checkFn: () => "a" });
          await engine.process(items);
        source: 'docs/reference/bucket-engine.md; docs/reference/process-output.md'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['sort-items-into-buckets']

      - mistake: 'Assuming BucketEngine.processOne behaves like ActionEngine.processOne (does not throw)'
        mechanism: >
          BucketEngine.processOne throws a BucketError on a validation or
          condition failure, because with a single item there is no rest of
          the batch to protect. ActionEngine.processOne deliberately does
          NOT throw on a checkFn/actionFn failure, for the opposite reason —
          actions are independent, so one failing shouldn't hide whether
          others matched. Code moved between the two engines without
          updating error handling will misbehave.
        wrong_pattern: |
          // Copied from ActionEngine code, assuming errors come back in a field
          const result = await bucketEngine.processOne(item);
          if (result.errors.length) { /* ... */ } // BucketAssignment has no `errors` field — throws before this line
        correct_pattern: |
          try {
            const result = await bucketEngine.processOne(item);
          } catch (error) {
            // error is a BucketError
          }
        source: 'docs/reference/bucket-engine.md; docs/reference/action-engine.md'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['sort-items-into-buckets', 'run-independent-actions']

  - name: 'Run independent actions'
    slug: 'run-independent-actions'
    domain: 'running-effects'
    description: >
      Use ActionEngine to run named side effects on the items that qualify
      for each one, and understand how its independence guarantees differ
      from BucketEngine's shared-expression model.
    type: 'core'
    covers:
      - 'defineAction'
      - 'ActionEngine.process / processOne'
      - 'ActionReport (results / unmatched / errors)'
    tasks:
      - 'Run named side effects (notify, charge a fee, queue for review) on items that qualify, independently of each other'
      - 'Understand why one action failing does not stop another action from running on the same item'
      - 'Decide whether a problem is "group items under names" (BucketEngine) or "run effects on qualifying items" (ActionEngine)'
    failure_modes:
      - mistake: "Assuming one action's failure poisons another action, the way one condition's failure poisons a bucket"
        mechanism: >
          A bucket's rule can reference several conditions in one boolean
          expression, so one throwing condition makes the whole item
          unevaluable for that rule. Actions don't share expressions with
          each other at all, so ActionEngine doesn't need that caution —
          chargeFraudFee throwing for an item is recorded in report.errors
          and flagForReview still runs for that same item.
        wrong_pattern: |
          // Assuming a failed action means no other action ran for this item
          if (report.errors.some((e) => e.item === order)) {
            assert(!report.results.flagForReview.some((r) => r.item === order)); // wrong — it can still be there
          }
        correct_pattern: |
          // flagForReview's success and chargeFraudFee's failure are independent facts
          const flagged = report.results.flagForReview.some((r) => r.item === order);
          const chargeFailed = report.errors.some((e) => e.item === order && e.action === "chargeFraudFee");
          // both can be true at once
        source: 'docs/guides/actions.md'
        priority: 'HIGH'
        status: 'active'
        skills: ['run-independent-actions']

      - mistake: 'Reaching for ActionEngine when the task is really "categorize items", or BucketEngine when the task is really "fire effects"'
        mechanism: >
          The two engines have nearly identical fluent APIs (defineInput,
          checkFn, process/processOne), so a task description that sounds
          like both ("categorize and notify") can lead to picking the wrong
          one. BucketEngine separates naming a condition from declaring a
          rule so conditions can be shared and combined with ONLY across
          many buckets; ActionEngine collapses predicate and effect into one
          step because actions never share a boolean expression with each
          other. If the real need is a shared, combinable boolean vocabulary,
          it's BucketEngine even if some buckets are "used" to trigger effects
          downstream; if it's independent effects with no ONLY-style
          completeness requirement, it's ActionEngine.
        wrong_pattern: |
          // Using ActionEngine to build what's actually a shared decision table,
          // duplicating the same checkFn logic across several actions
          .defineAction({ name: "warehouse", checkFn: (p) => p.weightKg !== null, actionFn: (p) => routeToWarehouse(p) })
          .defineAction({ name: "digital", checkFn: (p) => p.downloadUrl !== null, actionFn: (p) => routeToDigital(p) })
          // no shared vocabulary, no ONLY, no way to express "purely physical" without repeating both checks
        correct_pattern: |
          // BucketEngine when the checks compose into a shared vocabulary
          const routing = new BucketEngine()
            .defineInput<Product>()
            .defineCondition({ name: "hasWeight", checkFn: (p) => p.weightKg !== null })
            .defineCondition({ name: "isDigital", checkFn: (p) => p.downloadUrl !== null })
            .defineBucket({ name: "warehouse", checkFn: () => "hasWeight" })
            .defineBucket({ name: "digital", checkFn: () => "isDigital" })
            .defineBucket({ name: "purelyPhysical", checkFn: ({ ONLY }) => ONLY("hasWeight") });
        source: 'maintainer interview (library is new; this is a provisional AI-agent failure mode, not yet observed in the wild)'
        priority: 'MEDIUM'
        status: 'active'
        version_context: 'Provisional — flag for revision once real agent usage surfaces actual mistakes.'
        skills: ['run-independent-actions', 'sort-items-into-buckets']

      - mistake: "Assuming ActionEngine.processOne throws on failure like BucketEngine.processOne does"
        mechanism: >
          See the shared failure mode under "Sort items into buckets" —
          listed here too since it is exactly as likely to bite someone
          starting from ActionEngine and assuming BucketEngine's behavior.
        source: 'docs/reference/action-engine.md'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['run-independent-actions', 'sort-items-into-buckets']

  - name: 'Tune async conditions and scale'
    slug: 'tune-async-and-scale'
    domain: 'operating-at-scale'
    description: >
      Async checkFns are an escape hatch for local, bounded work — not the
      default way to write a condition. Covers when reaching for async is
      warranted, concurrency tuning, auditing conditions with
      processConditions() before a bucket exists, and watching a long
      batch progress live.
    type: 'core'
    covers:
      - 'async checkFn (escape hatch, not the default)'
      - 'concurrency option'
      - 'processConditions()'
      - 'onProgress / liveConditionReport()'
    tasks:
      - 'Recognize when a condition should be async (local, bounded work) vs when the I/O belongs in a step before process() runs'
      - 'Write an async condition (e.g. a billing lookup) without turning it into an ad hoc I/O orchestrator'
      - 'Tune concurrency for a large batch, understanding why the default is bounded rather than Infinity'
      - "Audit a set of conditions with processConditions() before there's a bucket to sort by"
      - 'Watch a long-running batch fill in live with liveConditionReport() instead of only seeing the table at the end'
    failure_modes:
      - mistake: 'Using an async condition to do real network I/O with retries/backoff'
        mechanism: >
          checkFn's async support is an escape hatch for local, bounded work
          (a filesystem read, a lookup against something already in memory),
          not a place to sequence or retry real network calls — buckets
          evaluates a predicate, it doesn't orchestrate I/O. Reaching for
          this often enough is a sign the network call belongs in a step
          before the data reaches process().
        wrong_pattern: |
          .defineCondition({
            name: "payingCustomer",
            checkFn: async (ticket) => {
              for (let attempt = 0; attempt < 3; attempt++) {
                try { return (await billing.lookup(ticket.accountId)).plan !== "free"; }
                catch { await sleep(2 ** attempt * 100); }
              }
              throw new Error("billing lookup failed after retries");
            },
          })
        correct_pattern: |
          // Resolve the I/O before process() runs; checkFn stays a pure lookup
          const accounts = await billingLookupWithRetries(tickets.map((t) => t.accountId));
          .defineCondition({
            name: "payingCustomer",
            checkFn: (ticket) => accounts.get(ticket.accountId)?.plan !== "free",
          })
        source: 'docs/guides/async-and-performance.md'
        priority: 'HIGH'
        status: 'active'
        skills: ['tune-async-and-scale']

      - mistake: 'Setting concurrency: Infinity expecting it to be faster or safer'
        mechanism: >
          Each lane keeps one item's condition promises alive while running,
          so Infinity means every item's promises exist simultaneously.
          Measured on 500,000 rows: Infinity is both the slowest (1785ms vs
          573ms at the default 256) and the heaviest (2435MB vs 283MB heap)
          option, which is why it isn't the default.
        wrong_pattern: |
          await engine.process(largeItemBatch, { concurrency: Infinity }); // slowest and heaviest option
        correct_pattern: |
          await engine.process(largeItemBatch, { concurrency: 256 }); // default; raise/lower based on measurement
        source: 'docs/guides/async-and-performance.md'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['tune-async-and-scale']

      - mistake: 'Reusing one liveConditionReport() callback across two concurrent processConditions() calls'
        mechanism: >
          Each call to liveConditionReport() creates its own independent
          redraw state (last-drawn frame, throttle timer). Passing the same
          callback instance to two concurrent batches corrupts the redraw —
          the two batches' frames interleave against shared state instead of
          drawing independently.
        wrong_pattern: |
          const onProgress = liveConditionReport();
          await Promise.all([
            engineA.processConditions(batchA, { onProgress }),
            engineB.processConditions(batchB, { onProgress }), // shares redraw state with the call above
          ]);
        correct_pattern: |
          await Promise.all([
            engineA.processConditions(batchA, { onProgress: liveConditionReport() }),
            engineB.processConditions(batchB, { onProgress: liveConditionReport({ stream: secondStream }) }),
          ]);
        source: 'modules/report.ts; docs/reference/bucket-engine.md ("each call to liveConditionReport() gets its own independent redraw state")'
        priority: 'LOW'
        status: 'active'
        version_context: 'onProgress/liveConditionReport() is new, unreleased functionality (uncommitted at time of this scan) — confirm it has shipped before publishing this skill.'
        skills: ['tune-async-and-scale']

      - mistake: 'Assuming onProgress fires in input order'
        mechanism: >
          onProgress fires once per item in **completion order**, not input
          order — the only order live progress can honestly report, since
          items finish whenever their conditions do. Code that indexes into
          the original items array using the progress callback's call count
          will misattribute rows.
        wrong_pattern: |
          let i = 0;
          engine.processConditions(items, {
            onProgress: () => console.log(`finished ${items[i++].id}`), // wrong — not completion-matched
          });
        correct_pattern: |
          // Use the summary/completed/total fields onProgress actually provides,
          // not an assumed correspondence to input order
          engine.processConditions(items, {
            onProgress: ({ completed, total }) => console.log(`${completed}/${total} done`),
          });
        source: 'docs/reference/process-output.md (ConditionProgress)'
        priority: 'LOW'
        status: 'active'
        skills: ['tune-async-and-scale']

      - mistake: 'Calling missingCombinations() on an engine with more than 16 conditions'
        mechanism: >
          missingCombinations() enumerates every 2^n assignment of the plain
          conditions to find uncovered combinations. It refuses to run past
          16 conditions (65,536 combinations) and throws a BucketError
          instead of hanging — the only place in the library that enumerates
          combinatorially.
        wrong_pattern: |
          // 20 plain conditions defined on the engine
          engine.missingCombinations(); // throws — refuses past 16 conditions
        correct_pattern: |
          // Group related conditions into computed conditions to reduce the
          // free-variable count, or check coverage per sub-area instead of globally
        source: 'docs/reference/bucket-engine.md; docs/guides/async-and-performance.md'
        priority: 'LOW'
        status: 'active'
        skills: ['tune-async-and-scale', 'model-decision-logic']

    compositions:
      - library: 'Standard Schema (Zod / Valibot / ArkType / Effect Schema)'
        skill: null # not enough distinct integration surface to warrant its own skill; covered inline in model-decision-logic (defineInput)

tensions:
  - name: 'Ordering strictness vs iterative prototyping'
    skills: ['model-decision-logic', 'sort-items-into-buckets']
    description: >
      The ordering rules (all conditions before the first computed condition
      and bucket) exist so ONLY stays meaningful, but they cut against the
      natural instinct to bolt on "just one more condition" once buckets are
      already sketched out.
    implication: >
      An agent iterating quickly will hit a BucketError when adding a late
      condition and may try to work around the ordering (e.g. redefining
      everything inline) instead of recognizing that clone()-ing the
      pre-bucket engine, or restructuring conditions to be complete up
      front, is the intended fix.

  - name: 'BucketEngine vs ActionEngine mental models'
    skills: ['sort-items-into-buckets', 'run-independent-actions']
    description: >
      BucketEngine's shared boolean vocabulary (conditions reused and
      combined across many buckets, with ONLY depending on the complete set)
      pulls toward one engine per decision domain; ActionEngine's
      independent, non-shared predicate-and-effect pairs pull toward
      whichever engine matches whether the items being "grouped" also need
      combinable boolean logic.
    implication: >
      An agent asked to "categorize and notify" may pick ActionEngine for
      the categorization half (losing ONLY/shared-condition benefits) or
      pick BucketEngine for the notification half (fighting its
      shared-failure semantics, where one bad condition can poison an
      otherwise-independent effect).

  - name: 'Type-narrowing honesty vs quick predicates'
    skills: ['model-decision-logic', 'sort-items-into-buckets']
    description: >
      Writing checkFn as a plain (item) => boolean is faster and still
      fully correct, but throws away narrowing; retrofitting a type
      predicate later is easy for the condition itself but easy to forget to
      check downstream (a bucket or computed condition consumer that was
      quietly relying on the wider type).
    implication: >
      An agent optimizing for "make it compile fastest" defaults to
      un-narrowed predicates even in the discriminated-union cases (routers,
      variant dispatch) where narrowing is most of the value the library
      offers over hand-written logic.

  - name: 'Async escape hatch vs bounded concurrency'
    skills: ['model-decision-logic', 'tune-async-and-scale']
    description: >
      Async checkFn support makes it easy to reach for a "just do the I/O
      here" condition, but the library's concurrency model is tuned for
      cheap, bounded lookups, not orchestrated network calls with retries.
    implication: >
      An agent that treats every I/O-shaped need as "put it in an async
      condition" ends up fighting the concurrency defaults (or setting
      concurrency: Infinity to compensate) instead of pre-fetching before
      process() runs, as the library's own guidance recommends.

cross_references:
  - from: 'model-decision-logic'
    to: 'sort-items-into-buckets'
    reason: >
      Conditions are almost always written to feed a bucket; understanding
      how ONLY and type predicates propagate into bucket item types makes
      conditions easier to design correctly the first time, rather than
      retrofitting them after buckets exist.

  - from: 'sort-items-into-buckets'
    to: 'run-independent-actions'
    reason: >
      If the task turns out to be "fire effects on qualifying items" rather
      than "group items under shared, combinable rules," ActionEngine is the
      sibling to reach for instead of forcing it through BucketEngine.

  - from: 'tune-async-and-scale'
    to: 'model-decision-logic'
    reason: >
      when's skip behavior (checkFn never runs when the precondition fails)
      is often the cheaper alternative to making a condition async in the
      first place — worth knowing before reaching for async.

  - from: 'run-independent-actions'
    to: 'sort-items-into-buckets'
    reason: >
      The report shape and error semantics look similar (results/unmatched/
      errors vs buckets/unmatched/errors) but mean different things for
      independence guarantees — worth cross-checking when moving code
      between the two engines.

